<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio en Vivo</title>

<style>

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  audio {
    width: min(90%, 420px);
  }

</style>
</head>

<body>

<audio id="radio" controls autoplay preload="auto"></audio>

<script>

/* ------------------------------------------------------------------
   CONFIGURACIÓN: id de la hoja, gid de la pestaña, y celda a leer
   ------------------------------------------------------------------ */

const SHEET_ID   = "1JWbCKHveAwhpcwN414iWu_HqMYppONntmYs8d7ix0QU";
const SHEET_GID  = "0";
const CELL_RANGE = "A1";

const SHEET_URL =
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
  `?tqx=out:csv&gid=${SHEET_GID}&range=${CELL_RANGE}`;

const CHECK_INTERVAL_MS = 60 * 1000; // 1 minuto

/* ------------------------------------------------------------------ */

const audio = document.getElementById("radio");
let currentUrl = null;
let autoplayBloqueado = false;

function parseCsvCell(text) {
  let t = text.trim();
  if (t.startsWith('"') && t.endsWith('"')) {
    t = t.slice(1, -1).replace(/""/g, '"');
  }
  return t.trim();
}

async function obtenerUrlDeSheet() {
  const resp = await fetch(SHEET_URL + "&_=" + Date.now(), { cache: "no-store" });
  if (!resp.ok) throw new Error("No se pudo leer la hoja (HTTP " + resp.status + ")");
  const text = await resp.text();
  const url = parseCsvCell(text);
  if (!url) throw new Error("La celda " + CELL_RANGE + " está vacía");
  return url;
}

function intentarReproducir() {
  // Truco: los navegadores SIEMPRE permiten autoplay si empieza muteado.
  // Una vez que ya está sonando, le quitamos el mute (eso no vuelve a
  // activar el bloqueo de autoplay).
  audio.muted = true;
  const p = audio.play();
  if (p && p.catch) {
    p.then(() => {
      autoplayBloqueado = false;
      setTimeout(() => { audio.muted = false; }, 250);
    }).catch(() => {
      autoplayBloqueado = true;
    });
  }
}

async function actualizarEstacion(esPrimeraCarga) {
  try {
    const url = await obtenerUrlDeSheet();
    if (url !== currentUrl) {
      currentUrl = url;
      const estabaSonando = !audio.paused;
      audio.src = url;
      audio.load();
      if (esPrimeraCarga || estabaSonando) intentarReproducir();
    }
  } catch (err) {
    console.error(err);
  }
}

// Respaldo: si el navegador bloqueó incluso el autoplay muteado (poco
// común), el primer toque en la página lo activa, sin mostrar botón.
document.addEventListener("click", () => {
  if (autoplayBloqueado) intentarReproducir();
  else if (audio.muted) audio.muted = false;
}, { once: false });

audio.addEventListener("stalled", () => audio.load());

actualizarEstacion(true);
setInterval(() => actualizarEstacion(false), CHECK_INTERVAL_MS);

</script>

</body>
</html>
