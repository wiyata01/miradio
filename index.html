<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio en Vivo</title>

<style>

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #111;
    overflow: hidden;
  }

  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

</style>
</head>

<body>

<iframe
  id="radioFrame"
  allow="autoplay; encrypted-media"
  allowfullscreen
  src="about:blank">
</iframe>

<script>

/* ------------------------------------------------------------------
   CONFIGURACIÓN: id de la hoja, gid de la pestaña, y celda a leer
   ------------------------------------------------------------------ */

const SHEET_ID   = "1JWbCKHveAwhpcwN414iWu_HqMYppONntmYs8d7ix0QU";
const SHEET_GID  = "0";
const CELL_RANGE = "A1";

const SHEET_URL =
  `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
  `?tqx=out:csv&gid=${SHEET_GID}&range=${CELL_RANGE}`;

const CHECK_INTERVAL_MS = 60 * 1000; // 1 minuto

/* ------------------------------------------------------------------ */

const frame = document.getElementById("radioFrame");
let currentUrl = null;

function parseCsvCell(text) {
  let t = text.trim();
  if (t.startsWith('"') && t.endsWith('"')) {
    t = t.slice(1, -1).replace(/""/g, '"');
  }
  return t.trim();
}

async function obtenerUrlDeSheet() {
  const resp = await fetch(SHEET_URL + "&_=" + Date.now(), { cache: "no-store" });
  if (!resp.ok) throw new Error("No se pudo leer la hoja (HTTP " + resp.status + ")");
  const text = await resp.text();
  const url = parseCsvCell(text);
  if (!url) throw new Error("La celda " + CELL_RANGE + " está vacía");
  return url;
}

async function actualizarEstacion() {
  try {
    const url = await obtenerUrlDeSheet();
    if (url !== currentUrl) {
      currentUrl = url;
      frame.src = url;
    }
  } catch (err) {
    console.error(err);
  }
}

actualizarEstacion();
setInterval(actualizarEstacion, CHECK_INTERVAL_MS);

</script>

</body>
</html>
